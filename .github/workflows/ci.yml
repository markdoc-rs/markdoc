# CI for markdoc — https://github.com/markdoc-rs/markdoc
#
# Pure-Rust library crate, no FFI. Linux only: nothing platform-specific is
# exercised, and the conformance corpus is byte-compared, not rendered.
#
# The gate itself is in `.github/scripts/check.sh`, not here, so release.yml
# runs exactly the same set before it publishes anything. A second list of
# steps drifts, and the half that drifts is always the one nobody watches.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: markdoc

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdoc
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # fmt, the lockfile, clippy, the vendored corpus, the tests, the
      # doctests, rustdoc and a release build.
      - name: check.sh
        run: bash markdoc/.github/scripts/check.sh markdoc
